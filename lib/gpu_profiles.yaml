H200:
  queue: H200
  hf_home: /mnt/shared/hf-models
  env:
    # Skip the multi-minute DeepGEMM warmup; kernels are still available
    # if vLLM decides to use them, we just don't precompile every shape.
    VLLM_DEEP_GEMM_WARMUP: skip

B200:
  queue: b200-k8s
  hf_home: /mnt/shared/hf_cache
  server_runtime: native
  k8s_plugin: nvidia
  env:
    VLLM_DEEP_GEMM_WARMUP: skip
    NCCL_CUMEM_HOST_ENABLE: 0

MI300X:
  queue: mi300_perf_eval
  image_repo: vllm/vllm-openai-rocm
  ecr_pull_through_cache: false
  server_runtime: native
  k8s_plugin: amd
  # Explicit pod CPU/memory, requests == limits (Guaranteed QoS), sized to ~85%
  # of node allocatable (191.4 CPU / 2.21 TiB) so the pod effectively has the node to itself.
  # Unset, the namespace LimitRange defaults apply (12 CPU / 200 GiB), which
  # throttle a TP8 server into ~2x slower decode. Memory also lets the largest
  # checkpoint stay in page cache (Kimi-K3 ~1.45 TiB, DeepSeek-V4-Pro ~0.8 TiB).
  k8s_resources:
    cpu: 160
    memory: 1.8Ti
  env:
    # OMP_NUM_THREADS=1 workaround after weight loading regression from https://github.com/vllm-project/vllm/pull/49919
    OMP_NUM_THREADS: 1
  # HF cache lives in the container default and is backed by an emptyDir volume
  # (reclaimed when the pod exits). A cluster with fast shared storage can point
  # this at a PVC/hostPath via the MI300X_HF_CACHE_VOLUME override; do NOT set an
  # hf_home under /mnt/shared unless that path is a real mount on the node, or the
  # cache lands on the root disk and is never reclaimed.

MI355X:
  queue: mi355_perf_eval
  image_repo: vllm/vllm-openai-rocm
  ecr_pull_through_cache: false
  server_runtime: native
  k8s_plugin: amd
  # Explicit pod CPU/memory, requests == limits (Guaranteed QoS), sized to ~85%
  # of node allocatable (127.4 CPU / 2.95 TiB; 8 CPUs are already held exclusively by other pods) so the pod effectively has the node to itself.
  # Unset, the namespace LimitRange defaults apply (12 CPU / 200 GiB), which
  # throttle a TP8 server into ~2x slower decode. Memory also lets the largest
  # checkpoint stay in page cache (Kimi-K3 ~1.45 TiB, DeepSeek-V4-Pro ~0.8 TiB).
  k8s_resources:
    cpu: 112
    memory: 2.5Ti
  env:
    # OMP_NUM_THREADS=1 workaround after weight loading regression from https://github.com/vllm-project/vllm/pull/49919
    OMP_NUM_THREADS: 1
  # See MI300X — HF cache defaults to an emptyDir-backed container path; override
  # the volume source per-cluster with MI355X_HF_CACHE_VOLUME.
